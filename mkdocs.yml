site_name: CSES Solutions
site_url: https://subhojit-dey1234.github.io/cses/
site_description: CSES Problem Set solutions by Subhojit Dey
repo_url: https://github.com/Subhojit-Dey1234/cses
repo_name: Subhojit-Dey1234/cses

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/js/excalidraw-viewer.js

extra_css:
  - assets/js/excalidraw-viewer.css

nav:
  - Home: index.md
  - Introduction:
    - introduction/index.md
    - Missing Number: introduction/missing_number.md
    - Weird Algorithm: introduction/weird_algorithm.md
    - Repetitions: introduction/repetitions.md
    - Increasing Array: introduction/increasing_array.md
